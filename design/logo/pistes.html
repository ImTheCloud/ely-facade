<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ely Facade : pistes de logo</title>
<style>
  :root { --noir:#141414; --rouge:#C8202B; --pierre:#F4F1EC; --gris:#6b6b6b; }
  * { box-sizing:border-box; }
  body { margin:0; padding:32px 16px; background:var(--pierre); color:var(--noir); font:16px/1.4 "Helvetica Neue",Arial,sans-serif; }
  h1 { font-size:1.4rem; margin:0 0 4px; }
  p.intro { margin:0 0 24px; color:var(--gris); max-width:60ch; }
  .grille { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px; }
  figure { margin:0; background:#fff; border-radius:12px; overflow:hidden; border:1px solid #e3ded6; }
  .clair, .sombre { display:flex; align-items:center; justify-content:center; padding:20px; }
  .clair { background:#fff; }
  .sombre { background:var(--noir); }
  svg { width:100%; max-width:240px; height:auto; display:block; }
  figcaption { padding:10px 14px; font-size:.9rem; border-top:1px solid #e3ded6; }
  figcaption b { display:inline-block; min-width:1.6em; color:var(--rouge); }
  .t { font-family:"Helvetica Neue",Arial,sans-serif; font-weight:800; }
</style>
</head>
<body>
<h1>Ely Facade : 8 pistes de logo</h1>
<p class="intro">Noir, rouge, blanc cassé. Chaque piste est montrée sur fond clair et sur fond sombre. Les lettres seront dessinées en courbes sur la version finale.</p>
<div class="grille">

<!-- 1. Nom en toutes lettres -->
<figure>
  <div class="clair"><svg viewBox="0 0 240 90" role="img" aria-label="ELY FAÇADE">
    <text x="0" y="52" class="t" font-size="56" letter-spacing="-1" fill="#141414">ELY</text>
    <rect x="0" y="62" width="40" height="5" fill="#C8202B"/>
    <text x="48" y="70" class="t" font-size="20" letter-spacing="7" fill="#C8202B">FAÇADE</text>
  </svg></div>
  <div class="sombre"><svg viewBox="0 0 240 90" aria-hidden="true">
    <text x="0" y="52" class="t" font-size="56" letter-spacing="-1" fill="#F4F1EC">ELY</text>
    <rect x="0" y="62" width="40" height="5" fill="#C8202B"/>
    <text x="48" y="70" class="t" font-size="20" letter-spacing="7" fill="#C8202B">FAÇADE</text>
  </svg></div>
  <figcaption><b>1</b>Nom en toutes lettres, trait rouge</figcaption>
</figure>

<!-- 2. Monogramme EF carré -->
<figure>
  <div class="clair"><svg viewBox="0 0 140 140" role="img" aria-label="EF">
    <rect width="140" height="140" rx="14" fill="#141414"/>
    <g fill="#F4F1EC"><rect x="28" y="30" width="12" height="80"/><rect x="28" y="30" width="38" height="12"/><rect x="28" y="64" width="30" height="12"/><rect x="28" y="98" width="38" height="12"/></g>
    <g fill="#C8202B"><rect x="76" y="30" width="12" height="80"/><rect x="76" y="30" width="38" height="12"/><rect x="76" y="64" width="30" height="12"/></g>
  </svg></div>
  <div class="sombre"><svg viewBox="0 0 140 140" aria-hidden="true">
    <rect width="140" height="140" rx="14" fill="#C8202B"/>
    <g fill="#F4F1EC"><rect x="28" y="30" width="12" height="80"/><rect x="28" y="30" width="38" height="12"/><rect x="28" y="64" width="30" height="12"/><rect x="28" y="98" width="38" height="12"/></g>
    <g fill="#141414"><rect x="76" y="30" width="12" height="80"/><rect x="76" y="30" width="38" height="12"/><rect x="76" y="64" width="30" height="12"/></g>
  </svg></div>
  <figcaption><b>2</b>Monogramme EF, deux lettres collées</figcaption>
</figure>

<!-- 3. Icône ronde -->
<figure>
  <div class="clair"><svg viewBox="0 0 140 140" role="img" aria-label="Ely Façade">
    <circle cx="70" cy="70" r="66" fill="#141414"/>
    <circle cx="70" cy="70" r="58" fill="none" stroke="#C8202B" stroke-width="3"/>
    <text x="70" y="86" text-anchor="middle" class="t" font-size="50" letter-spacing="-2" fill="#F4F1EC">EF</text>
    <rect x="46" y="96" width="48" height="4" fill="#C8202B"/>
  </svg></div>
  <div class="sombre"><svg viewBox="0 0 140 140" aria-hidden="true">
    <circle cx="70" cy="70" r="66" fill="#F4F1EC"/>
    <circle cx="70" cy="70" r="58" fill="none" stroke="#C8202B" stroke-width="3"/>
    <text x="70" y="86" text-anchor="middle" class="t" font-size="50" letter-spacing="-2" fill="#141414">EF</text>
    <rect x="46" y="96" width="48" height="4" fill="#C8202B"/>
  </svg></div>
  <figcaption><b>3</b>Icône ronde (favicon, WhatsApp)</figcaption>
</figure>

<!-- 4. Immeuble en fenêtres -->
<figure>
  <div class="clair"><svg viewBox="0 0 260 100" role="img" aria-label="ELY FAÇADE">
    <rect x="0" y="0" width="70" height="100" fill="#141414"/>
    <g fill="#F4F1EC"><rect x="10" y="10" width="20" height="20"/><rect x="40" y="10" width="20" height="20"/><rect x="10" y="40" width="20" height="20"/><rect x="40" y="40" width="20" height="20"/><rect x="10" y="70" width="20" height="20"/></g>
    <rect x="40" y="70" width="20" height="20" fill="#C8202B"/>
    <text x="84" y="50" class="t" font-size="38" fill="#141414">ELY</text>
    <text x="84" y="80" class="t" font-size="22" letter-spacing="5" fill="#C8202B">FAÇADE</text>
  </svg></div>
  <div class="sombre"><svg viewBox="0 0 260 100" aria-hidden="true">
    <rect x="0" y="0" width="70" height="100" fill="#F4F1EC"/>
    <g fill="#141414"><rect x="10" y="10" width="20" height="20"/><rect x="40" y="10" width="20" height="20"/><rect x="10" y="40" width="20" height="20"/><rect x="40" y="40" width="20" height="20"/><rect x="10" y="70" width="20" height="20"/></g>
    <rect x="40" y="70" width="20" height="20" fill="#C8202B"/>
    <text x="84" y="50" class="t" font-size="38" fill="#F4F1EC">ELY</text>
    <text x="84" y="80" class="t" font-size="22" letter-spacing="5" fill="#C8202B">FAÇADE</text>
  </svg></div>
  <figcaption><b>4</b>Immeuble en fenêtres, une fenêtre rouge</figcaption>
</figure>

<!-- 5. Briques -->
<figure>
  <div class="clair"><svg viewBox="0 0 260 100" role="img" aria-label="ELY FAÇADE">
    <g fill="#141414"><rect x="0" y="10" width="30" height="16"/><rect x="34" y="10" width="30" height="16"/><rect x="-15" y="30" width="30" height="16"/><rect x="19" y="30" width="30" height="16"/><rect x="53" y="30" width="30" height="16"/><rect x="0" y="50" width="30" height="16"/><rect x="38" y="50" width="26" height="16"/><rect x="-15" y="70" width="30" height="16"/><rect x="19" y="70" width="30" height="16"/></g>
    <rect x="53" y="70" width="30" height="16" fill="#C8202B"/>
    <text x="100" y="52" class="t" font-size="38" fill="#141414">ELY</text>
    <text x="100" y="80" class="t" font-size="22" letter-spacing="5" fill="#C8202B">FAÇADE</text>
  </svg></div>
  <div class="sombre"><svg viewBox="0 0 260 100" aria-hidden="true">
    <g fill="#F4F1EC"><rect x="0" y="10" width="30" height="16"/><rect x="34" y="10" width="30" height="16"/><rect x="-15" y="30" width="30" height="16"/><rect x="19" y="30" width="30" height="16"/><rect x="53" y="30" width="30" height="16"/><rect x="0" y="50" width="30" height="16"/><rect x="38" y="50" width="26" height="16"/><rect x="-15" y="70" width="30" height="16"/><rect x="19" y="70" width="30" height="16"/></g>
    <rect x="53" y="70" width="30" height="16" fill="#C8202B"/>
    <text x="100" y="52" class="t" font-size="38" fill="#F4F1EC">ELY</text>
    <text x="100" y="80" class="t" font-size="22" letter-spacing="5" fill="#C8202B">FAÇADE</text>
  </svg></div>
  <figcaption><b>5</b>Mur de briques, une brique remplacée en rouge</figcaption>
</figure>

<!-- 6. Coup de rouleau -->
<figure>
  <div class="clair"><svg viewBox="0 0 260 80" role="img" aria-label="ELY FAÇADE">
    <path d="M0 14 H236 L252 40 L236 66 H0 Z" fill="#C8202B"/>
    <text x="16" y="52" class="t" font-size="38" letter-spacing="2" fill="#F4F1EC">ELY FAÇADE</text>
  </svg></div>
  <div class="sombre"><svg viewBox="0 0 260 80" aria-hidden="true">
    <path d="M0 14 H236 L252 40 L236 66 H0 Z" fill="#F4F1EC"/>
    <text x="16" y="52" class="t" font-size="38" letter-spacing="2" fill="#141414">ELY FAÇADE</text>
  </svg></div>
  <figcaption><b>6</b>Bandeau, coup de rouleau</figcaption>
</figure>

<!-- 7. Barre verticale -->
<figure>
  <div class="clair"><svg viewBox="0 0 240 90" role="img" aria-label="ELY FAÇADE">
    <rect x="0" y="0" width="10" height="90" fill="#C8202B"/>
    <text x="26" y="44" class="t" font-size="44" letter-spacing="3" fill="#141414">ELY</text>
    <text x="26" y="80" class="t" font-size="30" letter-spacing="3" fill="#141414">FAÇADE</text>
  </svg></div>
  <div class="sombre"><svg viewBox="0 0 240 90" aria-hidden="true">
    <rect x="0" y="0" width="10" height="90" fill="#C8202B"/>
    <text x="26" y="44" class="t" font-size="44" letter-spacing="3" fill="#F4F1EC">ELY</text>
    <text x="26" y="80" class="t" font-size="30" letter-spacing="3" fill="#F4F1EC">FAÇADE</text>
  </svg></div>
  <figcaption><b>7</b>Texte empilé, barre rouge</figcaption>
</figure>

<!-- 8. Pointe de toit inversée = angle de façade -->
<figure>
  <div class="clair"><svg viewBox="0 0 260 100" role="img" aria-label="ELY FAÇADE">
    <path d="M0 100 V20 H60 V100 Z" fill="#141414"/>
    <path d="M60 100 V45 H90 V100 Z" fill="#C8202B"/>
    <text x="106" y="56" class="t" font-size="38" fill="#141414">ELY</text>
    <text x="106" y="84" class="t" font-size="22" letter-spacing="5" fill="#141414">FAÇADE</text>
  </svg></div>
  <div class="sombre"><svg viewBox="0 0 260 100" aria-hidden="true">
    <path d="M0 100 V20 H60 V100 Z" fill="#F4F1EC"/>
    <path d="M60 100 V45 H90 V100 Z" fill="#C8202B"/>
    <text x="106" y="56" class="t" font-size="38" fill="#F4F1EC">ELY</text>
    <text x="106" y="84" class="t" font-size="22" letter-spacing="5" fill="#F4F1EC">FAÇADE</text>
  </svg></div>
  <figcaption><b>8</b>Deux volumes : bâtiment et extension rénovée</figcaption>
</figure>

</div>
</body>
</html>
